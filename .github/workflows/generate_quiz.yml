name: Generate Daily Quiz

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily-quiz/requirements.txt

      - name: Run generator (uses OPENAI_API_KEY from secrets)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python daily-quiz/generate_quiz.py

      - name: Commit generated quizzes (optional)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # commit any changes to quizzes/ back to the repository
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quizzes || true
          git commit -m "chore: generate quizzes via CI" || echo "no changes to commit"
          git push || echo "push failed"
