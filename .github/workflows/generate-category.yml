name: Generate single category

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Plugin-Key (Dateiname unter ./kategorien, z.B. politiker)"
        required: true
        default: "politiker"
      count:
        description: "Anzahl Fragen"
        required: true
        default: "10"
      mode:
        description: "Difficulty-Profil"
        required: true
        default: "normal"
        type: choice
        options: ["normal", "schwer", "physik", "random"]
      shuffle:
        description: "Antworten mischen?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: daily-quiz/daily-quiz
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Debug env
        working-directory: daily-quiz/daily-quiz
        run: |
          python - << 'PY'
          import sys, importlib.util
          print("PY:", sys.executable)
          print("sys.path[0:3]:", sys.path[:3])
          print("requests spec:", importlib.util.find_spec("requests"))
          PY
          python generate_category_only.py --list

      - name: Generate
        working-directory: daily-quiz/daily-quiz
        shell: bash
        run: |
          [[ "${{ github.event.inputs.shuffle }}" == "true" ]] && SHUF="--shuffle" || SHUF=""
          mkdir -p out
          python generate_category_only.py \
            --category "${{ github.event.inputs.category }}" \
            --count "${{ github.event.inputs.count }}" \
            --mode "${{ github.event.inputs.mode }}" \
            --out "out/${{ github.event.inputs.category }}.${{ github.event.inputs.count }}.${{ github.run_id }}.json" \
            $SHUF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.category }}-${{ github.event.inputs.count }}-${{ github.event.inputs.mode }}
          path: daily-quiz/daily-quiz/out/*.json
          if-no-files-found: error
