name: Generate Category

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Plugin-Key (z.B. politiker, politik, natur)"
        required: true
        default: "politiker"
      count:
        description: "Anzahl Fragen"
        required: true
        default: "20"
      mode:
        description: "Mode (normal|schwer|physik|random)"
        required: true
        default: "random"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # oder "3.13", aber dann überall konsistent

      - name: Install dependencies
        working-directory: daily-quiz/daily-quiz
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show env info (debug)
        working-directory: daily-quiz/daily-quiz
        run: |
          python -c "import sys,requests; print(sys.executable); print(requests.__version__)"

      - name: Generate
        working-directory: daily-quiz/daily-quiz
        run: |
          python generate_category_only.py --list
          python generate_category_only.py -c "${{ github.event.inputs.category }}" -n "${{ github.event.inputs.count }}" -m "${{ github.event.inputs.mode }}" --shuffle
